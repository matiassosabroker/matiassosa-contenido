<script type="module">
import * as THREE from 'three';

const PLANO = JSON.parse(document.getElementById('plano-data').textContent);
const H = PLANO.altura_muros;            // altura de muros (m)
const colliders = [];                     // [x0,z0,x1,z1] en metros (x este, z sur)

/* ---------- escena, render, luz ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde4ea);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const cx = 3.9, cz = 2.0;
scene.add(new THREE.AmbientLight(0xffffff, 1.05));
const sol = new THREE.DirectionalLight(0xfff3e0, 0.7);   // una sola luz con sombra
sol.position.set(cx + 2, 12, cz + 1.5);
sol.target.position.set(cx, 0, cz);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -7, right: 7, top: 6, bottom: -6, near: 1, far: 30 });
sol.shadow.bias = -0.0006;
scene.add(sol, sol.target);

/* ---------- materiales ---------- */
const mat = c => new THREE.MeshLambertMaterial({ color: c });
const M = {
  muro: mat(0xd9d9d6), techo: mat(0xf7f6f3), hoja: mat(0xf3f2ee),
  liston: mat(0xb98b5a), columna: mat(0xd9d9d6), barra: mat(0xa87b4f), suelo: mat(0xbdb5a6)
};
const vidrio = new THREE.MeshBasicMaterial({ color: 0xbfd8e6, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false });

const box = (w, h, d, m, x, y, z, sombra = true) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); o.castShadow = sombra; o.receiveShadow = true; scene.add(o); return o;
};

/* suelo exterior (para el patio abierto de la cocina) */
const ext = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M.suelo);
ext.rotation.x = -Math.PI / 2; ext.position.set(cx, -0.02, cz); ext.receiveShadow = true; scene.add(ext);

/* ---------- muros extruidos con vanos recortados ---------- */
function muro(w) {
  const [x1, z1] = w.a, [x2, z2] = w.b;
  const horiz = Math.abs(z1 - z2) < 1e-6;               // corre a lo largo de x
  const s0 = horiz ? Math.min(x1, x2) : Math.min(z1, z2);
  const s1 = horiz ? Math.max(x1, x2) : Math.max(z1, z2);
  const c = horiz ? z1 : x1, t = w.t;
  const tramo = (a, b, y0, y1, macizo) => {
    if (b - a < 1e-4 || y1 - y0 < 1e-4) return;
    const m = (a + b) / 2, y = (y0 + y1) / 2;
    if (horiz) box(b - a, y1 - y0, t, M.muro, m, y, c); else box(t, y1 - y0, b - a, M.muro, c, y, m);
    if (macizo) colliders.push(horiz ? [a, c - t / 2, b, c + t / 2] : [c - t / 2, a, c + t / 2, b]);
  };
  let cur = s0;
  for (const o of (w.aberturas || []).slice().sort((p, q) => p.desde - q.desde)) {
    tramo(cur, o.desde, 0, H, true);                    // muro hasta el vano
    tramo(o.desde, o.hasta, 0, o.umbral, o.umbral > 0); // antepecho (ventanas)
    tramo(o.desde, o.hasta, o.dintel, H, false);        // dintel
    if (o.tipo === 'ventana') {                         // vidrio
      const g = new THREE.Mesh(horiz ? new THREE.PlaneGeometry(o.hasta - o.desde, o.dintel - o.umbral)
                                     : new THREE.PlaneGeometry(o.hasta - o.desde, o.dintel - o.umbral), vidrio);
      g.position.set(horiz ? (o.desde + o.hasta) / 2 : c, (o.umbral + o.dintel) / 2, horiz ? c : (o.desde + o.hasta) / 2);
      if (!horiz) g.rotation.y = Math.PI / 2;
      scene.add(g);
    }
    cur = o.hasta;
  }
  tramo(cur, s1, 0, H, true);
}
PLANO.muros.forEach(muro);

/* ---------- pisos y techos ---------- */
// porcelanato gris claro tipo cemento, mate. Formato 60 x 120 cm (estimado de la muestra)
const pisoTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#b9bbba'; g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 2500; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(70,75,75,.05)'; g.fillRect(Math.random() * 256, Math.random() * 512, 18 + Math.random() * 30, 10 + Math.random() * 24); }
  g.fillStyle = '#8d9090'; g.fillRect(253, 0, 3, 512); g.fillRect(0, 509, 256, 3);   // juntas
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const matPiso = (w, h) => { const t = pisoTex.clone(); t.needsUpdate = true; t.repeat.set(w / 0.6, h / 1.2); return new THREE.MeshLambertMaterial({ map: t }); };
for (const p of PLANO.pisos) {
  const [x0, z0, x1, z1] = p.rect;
  const f = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), matPiso(x1 - x0, z1 - z0));
  f.rotation.x = -Math.PI / 2; f.position.set((x0 + x1) / 2, 0.005, (z0 + z1) / 2); f.receiveShadow = true; scene.add(f);
}
const techos = [];
for (const [x0, z0, x1, z1] of PLANO.techos) {
  const t = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), M.techo);
  t.rotation.x = Math.PI / 2; t.position.set((x0 + x1) / 2, H, (z0 + z1) / 2);   // mira hacia abajo
  scene.add(t); techos.push(t);                                                  // no proyecta sombra
}

/* ---------- listones, columna, hojas de puerta ---------- */
{
  const L = PLANO.listones, xm = (L.x[0] + L.x[1]) / 2;
  for (let z = L.z[0] + L.espesor / 2; z <= L.z[1]; z += L.paso)
    box(L.profundidad, H, L.espesor, M.liston, xm, H / 2, z);
  colliders.push([L.x[0], L.z[0], L.x[1], L.z[1]]);
  for (const c of PLANO.columnas) {
    const [x0, z0, x1, z1] = c.rect;
    box(x1 - x0, H, z1 - z0, M.columna, (x0 + x1) / 2, H / 2, (z0 + z1) / 2);
    colliders.push(c.rect);
  }
  for (const b of PLANO.barras) {
    const [x0, z0, x1, z1] = b.rect;
    box(x1 - x0, b.altura, z1 - z0, M.barra, (x0 + x1) / 2, b.altura / 2, (z0 + z1) / 2);
    colliders.push(b.rect);
  }
  for (const h of PLANO.hojas_puerta)
    box(h.tam[0], 2.0, h.tam[1], M.hoja, h.centro[0], 1.0, h.centro[1]);
}

/* ---------- mobiliario (a medida real, primitivas de three.js) ---------- */
const mobiliario = new THREE.Group(); scene.add(mobiliario);
const colMuebles = [];
const matCache = {};
const matDe = m => m.vidrio ? vidrio : (matCache[m.color + (m.emisivo ? 'e' : '')] ||= m.emisivo ? new THREE.MeshBasicMaterial({ color: m.color }) : mat(m.color));
const poner = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, matDe(m)); o.position.set(x, y, z); o.castShadow = !m.vidrio && !m.emisivo; o.receiveShadow = !m.vidrio; mobiliario.add(o); return o; };
for (const m of PLANO.muebles) {
  if (m.t === 'caja') {
    const [x0, x1, y0, y1, z0, z1] = m.b;
    poner(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    if (m.solido) colMuebles.push([x0, z0, x1, z1]);
  } else if (m.t === 'cil') {
    poner(new THREE.CylinderGeometry(m.r, m.r, m.y[1] - m.y[0], 24), m, m.pos[0], (m.y[0] + m.y[1]) / 2, m.pos[1]);
    if (m.solido) colMuebles.push([m.pos[0] - m.r, m.pos[1] - m.r, m.pos[0] + m.r, m.pos[1] + m.r]);
  } else if (m.t === 'domo') {
    const d = poner(new THREE.SphereGeometry(m.r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), m, m.pos[0], m.pos[1], m.pos[2]);
    d.material = new THREE.MeshLambertMaterial({ color: m.color, side: THREE.DoubleSide });
  } else if (m.t === 'col') colMuebles.push(m.rect);
}

/* ---------- etiquetas (solo en vista Planta) ---------- */
const etiquetas = new THREE.Group(); etiquetas.visible = false; scene.add(etiquetas);
for (const [txt, x, z] of PLANO.etiquetas) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const g = cv.getContext('2d'); g.font = '600 64px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.strokeStyle = 'rgba(255,255,255,.9)'; g.strokeText(txt, 256, 64); g.fillStyle = '#5a2a14'; g.fillText(txt, 256, 64);
  const tx = new THREE.CanvasTexture(cv); tx.anisotropy = 4;
  const e = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.5), new THREE.MeshBasicMaterial({ map: tx, transparent: true, depthWrite: false }));
  e.rotation.x = -Math.PI / 2; e.position.set(x, 0.03, z); etiquetas.add(e);
}

/* ---------- cámaras ---------- */
const cam = new THREE.PerspectiveCamera(70, 1, 0.05, 80);
cam.rotation.order = 'YXZ';
let yaw = 0, pitch = 0;
cam.position.set(PLANO.camara_inicio.pos[0], PLANO.camara_inicio.altura, PLANO.camara_inicio.pos[1]); // puerta de entrada, 1,60 m

const top = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 60);
top.up.set(0, 0, -1);                         // norte arriba
top.position.set(cx, 30, cz - 0.1); top.lookAt(cx, 0, cz - 0.1);
const BOX = { w: 8.6, h: 6.9 };               // encuadre de la planta (m)

let vista = 'recorrido';
const btn = document.getElementById('btnVista'), stick = document.getElementById('stick'), ayuda = document.getElementById('ayuda');
const btnM = document.getElementById('btnMuebles');
btnM.addEventListener('click', () => { mobiliario.visible = !mobiliario.visible; btnM.textContent = mobiliario.visible ? 'Vacío' : 'Amoblado'; });
btnM.addEventListener('pointerdown', e => e.stopPropagation());
function setVista(v) {
  vista = v;
  const p = v === 'planta';
  techos.forEach(t => t.visible = !p);
  etiquetas.visible = p;
  stick.style.display = ayuda.style.display = p ? 'none' : '';
  btn.textContent = p ? 'Recorrido' : 'Planta';
}
btn.addEventListener('click', () => setVista(vista === 'planta' ? 'recorrido' : 'planta'));
btn.addEventListener('pointerdown', e => e.stopPropagation());

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  cam.aspect = a; cam.updateProjectionMatrix();
  const hh = Math.max(BOX.h, BOX.w / a) / 2, hw = hh * a;
  Object.assign(top, { left: -hw, right: hw, top: hh, bottom: -hh }); top.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- controles: mirar arrastrando, caminar con joystick o teclado ---------- */
const keys = {}; addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
let look = null;
renderer.domElement.addEventListener('pointerdown', e => { if (vista === 'recorrido') look = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => {
  if (look && e.pointerId === look.id) {
    yaw -= (e.clientX - look.x) * 0.005;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - look.y) * 0.005));
    look.x = e.clientX; look.y = e.clientY;
  }
  if (js && e.pointerId === js.id) {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
    jv.x = dx / R; jv.y = -dy / R;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  }
});
const end = e => { if (look && e.pointerId === look.id) look = null; if (js && e.pointerId === js.id) { js = null; jv.x = jv.y = 0; knob.style.transform = ''; } };
addEventListener('pointerup', end); addEventListener('pointercancel', end);
const knob = document.getElementById('knob'); let js = null; const jv = { x: 0, y: 0 };
stick.addEventListener('pointerdown', e => { js = { id: e.pointerId }; e.stopPropagation(); stick.setPointerCapture?.(e.pointerId); });

const RADIO = 0.22;                                   // radio del cuerpo (m)
const choca = (x, z) => (mobiliario.visible && colMuebles.some(c => x > c[0] - RADIO && x < c[2] + RADIO && z > c[1] - RADIO && z < c[3] + RADIO)) || colliders.some(c => x > c[0] - RADIO && x < c[2] + RADIO && z > c[1] - RADIO && z < c[3] + RADIO);

let t0 = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - t0) / 1000, 0.05); t0 = now;
  if (vista === 'recorrido') {
    let f = jv.y + (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    let s = jv.x + (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    if (keys.ArrowLeft) yaw += 1.8 * dt; if (keys.ArrowRight) yaw -= 1.8 * dt;
    const n = Math.hypot(f, s); if (n > 1) { f /= n; s /= n; }
    const v = 1.6 * dt;
    const dx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * v, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * v;
    if (!choca(cam.position.x + dx, cam.position.z)) cam.position.x += dx;   // desliza por los muros
    if (!choca(cam.position.x, cam.position.z + dz)) cam.position.z += dz;
    cam.rotation.set(pitch, yaw, 0);
    renderer.render(scene, cam);
  } else renderer.render(scene, top);
});
window.__recorrido = { setVista, cam, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, set pitch(v) { pitch = v; } };
</script>
<script>
  // si el módulo no carga (sin conexión a jsDelivr), avisar
  addEventListener('error', e => { if (e.target && e.target.tagName === 'SCRIPT') document.getElementById('err').style.display = 'flex'; }, true);
</script>
