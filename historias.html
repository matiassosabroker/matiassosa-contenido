<style>
  :root{
    --bg: #10111B;
    --surface: #191B29;
    --surface-2: #212436;
    --line: #2E3247;
    --cream: #F3F1EA;
    --cream-dim: #B9B8C4;
    --signal: #FF5A73;
    --cyan: #46D9C7;
    --text: #F3F1EA;
    --text-dim: #8A8DA3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 400px at 15% -10%, rgba(255,90,115,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(70,217,199,0.07), transparent 55%),
      #10111B;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  .profile-hero{ display:flex; align-items:center; gap: 18px; margin-bottom: 22px; }
  .profile-avatar-lg{ width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 2px solid var(--signal); flex-shrink:0; background: linear-gradient(135deg, var(--signal), var(--cyan)); }
  .profile-avatar-lg img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile-name-lg{ font-family:'Fraunces', serif; font-size: 26px; font-weight: 600; color: var(--cream); line-height:1.1; }
  .profile-role-lg{ font-family:'Montserrat', sans-serif; font-size: 12px; color: var(--signal); letter-spacing: .06em; text-transform: uppercase; margin-top: 5px; font-weight:600; }

  header{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap: wrap; gap: 16px;
    margin-bottom: 28px; border-bottom: 1px solid var(--line); padding-bottom: 20px;
  }
  h1{ font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle{ color: var(--text-dim); font-size: 13px; margin-top: 6px; font-family: 'Montserrat', sans-serif; }

  .tabnav{ display:flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; width: fit-content; margin-top: 16px; }
  .tabnav a{ font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.03em; padding: 8px 16px; border-radius: 6px; color: var(--text-dim); text-decoration: none; transition: all .15s ease; }
  .tabnav a:hover{ color: var(--cream); }
  .tabnav a.active{ background: var(--signal); color: #10111B; font-weight: 600; }

  .btn{
    background: var(--signal); color: #10111B; border: none; padding: 11px 18px; border-radius: 4px;
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.02em;
    cursor: pointer; transition: opacity .15s ease, transform .1s ease;
  }
  .btn:hover{ opacity:.88; } .btn:active{ transform: scale(0.98); }
  .btn.secondary{ background: transparent; border: 1px solid var(--line); color: var(--cream); }
  .btn.cyan{ background: var(--cyan); }
  .btn.small{ padding: 7px 12px; font-size: 11px; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }

  .editor-layout{ display:grid; grid-template-columns: 220px 1fr 260px; gap: 18px; align-items:start; }
  @media (max-width: 980px){ .editor-layout{ grid-template-columns: 1fr; } }

  .panel{ background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  .panel-title{ font-family:'Montserrat', sans-serif; font-size: 11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color: var(--text-dim); margin-bottom: 12px; }

  /* Lista de secuencias */
  .seq-item{
    padding: 10px 12px; border-radius: 4px; margin-bottom: 6px; cursor:pointer;
    font-size: 13px; color: var(--cream-dim); border: 1px solid transparent;
    display:flex; justify-content:space-between; align-items:center; gap:6px;
  }
  .seq-item:hover{ background: var(--surface-2); }
  .seq-item.active{ background: rgba(255,90,115,0.1); border-color: var(--signal); color: var(--cream); }
  .seq-item button{ background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:12px; flex-shrink:0; }
  .seq-item button:hover{ color: var(--signal); }

  /* Canvas central */
  .canvas-stage{ display:flex; flex-direction:column; align-items:center; gap: 14px; }
  .canvas-holder{
    background: #000; border-radius: 4px; overflow:hidden; box-shadow: 0 0 0 1px var(--line);
    cursor: default;
  }
  #storyCanvas{ display:block; touch-action:none; }

  .slide-thumbs{ display:flex; gap: 8px; flex-wrap:wrap; justify-content:center; }
  .thumb{
    width: 44px; height: 78px; border-radius: 3px; border: 2px solid var(--line);
    cursor: pointer; overflow:hidden; background:#000; position:relative; flex-shrink:0;
  }
  .thumb.active{ border-color: var(--signal); }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb-add{ display:flex; align-items:center; justify-content:center; color: var(--text-dim); font-size:18px; }
  .thumb-del{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none;
    width:16px; height:16px; font-size:10px; border-radius:50%; cursor:pointer; line-height:1;
  }

  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; font-family:'Montserrat',sans-serif; }
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 10px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif;
  }
  .field textarea{ min-height: 60px; resize: vertical; }
  .field input[type=color]{ width:100%; height:34px; border:1px solid var(--line); border-radius:3px; background:var(--bg); cursor:pointer; }
  .field input:focus, .field textarea:focus{ outline:1px solid var(--signal); border-color:var(--signal); }
  .row-2{ display:flex; gap:8px; }
  .row-2 .field{ flex:1; }

  .empty-note{ color: var(--text-dim); font-size:12px; text-align:center; padding: 20px 10px; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }
</style>
</head>

      <input type="text" id="seqName" placeholder="Nombre de la secuencia" style="background:var(--surface); border:1px solid var(--line); color:var(--cream); font-family:'Montserrat',sans-serif; font-size:13px; padding:8px 14px; border-radius:4px; text-align:center; width:280px;">
      <div class="canvas-holder">
        <canvas id="storyCanvas" width="1080" height="1920" style="width:243px; height:432px;"></canvas>
      </div>
      <div class="slide-thumbs" id="slideThumbs"></div>
    </div>

    <!-- Columna derecha: controles -->
    <div class="panel">
      <div class="panel-title">Fondo del slide</div>
      <div class="field">
        <label>Subir imagen</label>
        <input type="file" id="bgFile" accept="image/*">
      </div>
      <div class="field">
        <label>O color sólido</label>
        <input type="color" id="bgColor" value="#10111B">
      </div>
      <div class="field">
        <label>Brillo del fondo</label>
        <input type="range" id="bgBrightness" min="20" max="100" value="100">
      </div>

      <div class="panel-title" style="margin-top:20px;">Texto</div>
      <button class="btn small" style="width:100%; margin-bottom:12px;" id="btnAddText">+ Agregar texto</button>
      <div id="textControls" style="display:none;">
        <div class="field"><label>Contenido</label><textarea id="txtContent"></textarea></div>
        <div class="row-2">
          <div class="field"><label>Tamaño</label><input type="number" id="txtSize" min="16" max="140" value="48"></div>
          <div class="field"><label>Color</label><input type="color" id="txtColor" value="#F3F1EA"></div>
        </div>
        <div class="field">
          <label>Estilo</label>
          <select id="txtWeight">
            <option value="400">Normal</option>
            <option value="600" selected>Semibold</option>
            <option value="700">Bold</option>
          </select>
        </div>
        <button class="btn secondary small" style="width:100%;" id="btnDelText">Borrar texto</button>
      </div>
      <div class="empty-note" id="noTextNote">Tocá un texto en el lienzo para editarlo, o agregá uno nuevo.</div>

      <div style="margin-top:20px; display:flex; gap:8px;">
        <button class="btn secondary small" style="flex:1;" id="btnSaveSeq">Guardar</button>
        <button class="btn secondary small" style="flex:1;" id="btnDelSlide">Borrar slide</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: config supabase -->
<div class="modal-overlay" id="modalSb" style="position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;">
  <div style="background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:26px; width:100%; max-width:420px;">
    <h2 style="font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin-bottom:18px; color:var(--cream);">Conectar Supabase</h2>
    <div class="field"><label>Project URL</label><input type="text" id="f_sb_url" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Anon public key</label><input type="text" id="f_sb_key" placeholder="sb_publishable_..."></div>
    <div id="sbStatus" style="font-size:12px; margin-top:10px;"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn secondary" style="flex:1;" id="btnCancelSb">Cancelar</button>
      <button class="btn" style="flex:1;" id="btnSaveSb">Conectar</button>
    </div>
  </div>
</div>

<script>
let sb = null;
let sequences = [];
let currentSeqId = null;
let currentSlideIdx = 0;
let selectedTextId = null;
let dragging = null; // { id, offsetX, offsetY }

const CANVAS_W = 1080, CANVAS_H = 1920;
const canvas = document.getElementById('storyCanvas');
const ctx = canvas.getContext('2d');

function newSlide(){
  return { id: crypto.randomUUID(), bg: { type:'color', value:'#10111B', brightness:100 }, texts: [] };
}
function newSequence(){
  return { id: null, nombre: 'Nueva secuencia', slides: [newSlide()] };
}
function currentSeq(){
  return sequences.find(s => s.id === currentSeqId) || null;
}
function currentSlide(){
  const seq = currentSeq();
  if(!seq) return null;
  return seq.slides[currentSlideIdx] || null;
}

// ---- Supabase connect ----
function openModal(id){ document.getElementById(id).style.display='flex'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }
document.getElementById('btnConfigSb').onclick = () => openModal('modalSb');
document.getElementById('btnCancelSb').onclick = () => closeModal('modalSb');
document.getElementById('btnSaveSb').onclick = () => {
  const url = document.getElementById('f_sb_url').value.trim();
  const key = document.getElementById('f_sb_key').value.trim();
  const st = document.getElementById('sbStatus');
  if(!url||!key){ st.textContent='Completá los dos campos.'; st.style.color='#FF5A73'; return; }
  try{
    sb = window.supabase.createClient(url, key);
    localStorage.setItem('ms_supabase_cfg', JSON.stringify({url,key}));
    st.textContent='Conectado.'; st.style.color='#46D9C7';
    loadSequences();
    setTimeout(()=>closeModal('modalSb'), 600);
  }catch(e){ st.textContent='Error: '+e.message; st.style.color='#FF5A73'; }
};
(function autoConnect(){
  try{
    const saved = localStorage.getItem('ms_supabase_cfg');
    if(saved){ const {url,key} = JSON.parse(saved); if(url&&key){ sb = window.supabase.createClient(url,key); loadSequences(); } }
  }catch(e){}
})();

async function loadSequences(){
  if(!sb) return;
  const { data, error } = await sb.from('historias_secuencias').select('*').order('updated_at', { ascending:false });
  if(error){ console.error(error); return; }
  sequences = (data||[]).map(r => ({ id:r.id, nombre:r.nombre, slides: r.slides && r.slides.length ? r.slides : [newSlide()] }));
  if(sequences.length === 0){
    sequences.push(newSequence());
  }
  currentSeqId = sequences[0].id;
  currentSlideIdx = 0;
  renderSeqList();
  loadSlideIntoEditor();
}

function renderSeqList(){
  const list = document.getElementById('seqList');
  if(sequences.length === 0){
    list.innerHTML = '<div class="empty-note">Sin secuencias todavía.</div>';
    return;
  }
  list.innerHTML = sequences.map(s => `
    <div class="seq-item ${s.id===currentSeqId?'active':''}" data-id="${s.id||''}">
      <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.nombre}</span>
      <button class="del-seq" data-id="${s.id||''}">✕</button>
    </div>`).join('');
  document.querySelectorAll('.seq-item').forEach(el => {
    el.onclick = (e) => {
      if(e.target.classList.contains('del-seq')) return;
      currentSeqId = el.dataset.id || null;
      currentSlideIdx = 0;
      loadSlideIntoEditor();
      renderSeqList();
    };
  });
  document.querySelectorAll('.del-seq').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      if(!confirm('¿Borrar esta secuencia?')) return;
      const id = btn.dataset.id;
      if(id && sb) await sb.from('historias_secuencias').delete().eq('id', id);
      sequences = sequences.filter(s => s.id !== id);
      if(sequences.length === 0) sequences.push(newSequence());
      currentSeqId = sequences[0].id;
      currentSlideIdx = 0;
      renderSeqList();
      loadSlideIntoEditor();
    };
  });
}

document.getElementById('btnNewSeq').onclick = () => {
  const seq = newSequence();
  sequences.unshift(seq);
  currentSeqId = seq.id;
  currentSlideIdx = 0;
  renderSeqList();
  loadSlideIntoEditor();
};

function loadSlideIntoEditor(){
  const seq = currentSeq();
  document.getElementById('seqName').value = seq ? seq.nombre : '';
  selectedTextId = null;
  renderThumbs();
  redrawCanvas();
  updateTextPanel();
}

document.getElementById('seqName').oninput = (e) => {
  const seq = currentSeq();
  if(seq) seq.nombre = e.target.value;
  renderSeqList();
};

// ---- Thumbnails / slides ----
function renderThumbs(){
  const seq = currentSeq();
  const wrap = document.getElementById('slideThumbs');
  if(!seq){ wrap.innerHTML=''; return; }
  wrap.innerHTML = seq.slides.map((sl, i) => `
    <div class="thumb ${i===currentSlideIdx?'active':''}" data-i="${i}" style="background:${sl.bg.type==='color'?sl.bg.value:'#000'};">
      ${sl.bg.type==='image' ? `<img src="${sl.bg.value}">` : ''}
      <button class="thumb-del" data-i="${i}">✕</button>
    </div>
  `).join('') + `<div class="thumb thumb-add" id="thumbAdd">+</div>`;

  wrap.querySelectorAll('.thumb[data-i]').forEach(el => {
    el.onclick = (e) => {
      if(e.target.classList.contains('thumb-del')) return;
      currentSlideIdx = parseInt(el.dataset.i);
      selectedTextId = null;
      renderThumbs(); redrawCanvas(); updateTextPanel();
    };
  });
  wrap.querySelectorAll('.thumb-del').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const seq = currentSeq();
      if(seq.slides.length <= 1) return alert('La secuencia necesita al menos un slide.');
      seq.slides.splice(parseInt(btn.dataset.i), 1);
      if(currentSlideIdx >= seq.slides.length) currentSlideIdx = seq.slides.length - 1;
      renderThumbs(); redrawCanvas(); updateTextPanel();
    };
  });
  document.getElementById('thumbAdd').onclick = () => {
    const seq = currentSeq(); if(!seq) return;
    seq.slides.push(newSlide());
    currentSlideIdx = seq.slides.length - 1;
    renderThumbs(); redrawCanvas(); updateTextPanel();
  };
}

document.getElementById('btnDelSlide').onclick = () => {
  const seq = currentSeq(); if(!seq) return;
  if(seq.slides.length <= 1) return alert('La secuencia necesita al menos un slide.');
  seq.slides.splice(currentSlideIdx, 1);
  if(currentSlideIdx >= seq.slides.length) currentSlideIdx = seq.slides.length - 1;
  renderThumbs(); redrawCanvas(); updateTextPanel();
};

// ---- Background controls ----
document.getElementById('bgFile').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const slide = currentSlide();
    slide.bg = { type:'image', value: reader.result, brightness: 100 };
    document.getElementById('bgBrightness').value = 100;
    redrawCanvas(); renderThumbs();
  };
  reader.readAsDataURL(file);
};
document.getElementById('bgColor').oninput = (e) => {
  const slide = currentSlide(); if(!slide) return;
  slide.bg = { type:'color', value: e.target.value, brightness: 100 };
  redrawCanvas(); renderThumbs();
};
document.getElementById('bgBrightness').oninput = (e) => {
  const slide = currentSlide(); if(!slide) return;
  slide.bg.brightness = parseInt(e.target.value);
  redrawCanvas();
};

// ---- Text elements ----
document.getElementById('btnAddText').onclick = () => {
  const slide = currentSlide(); if(!slide) return;
  const t = {
    id: crypto.randomUUID(), content:'Nuevo texto', x: CANVAS_W/2, y: CANVAS_H/2,
    size: 64, color: '#F3F1EA', weight: '600'
  };
  slide.texts.push(t);
  selectedTextId = t.id;
  redrawCanvas(); updateTextPanel();
};
document.getElementById('btnDelText').onclick = () => {
  const slide = currentSlide(); if(!slide || !selectedTextId) return;
  slide.texts = slide.texts.filter(t => t.id !== selectedTextId);
  selectedTextId = null;
  redrawCanvas(); updateTextPanel();
};
['txtContent','txtSize','txtColor','txtWeight'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const slide = currentSlide(); if(!slide || !selectedTextId) return;
    const t = slide.texts.find(t => t.id === selectedTextId);
    if(!t) return;
    t.content = document.getElementById('txtContent').value;
    t.size = parseInt(document.getElementById('txtSize').value || '48');
    t.color = document.getElementById('txtColor').value;
    t.weight = document.getElementById('txtWeight').value;
    redrawCanvas();
  });
});

function updateTextPanel(){
  const slide = currentSlide();
  const t = slide && selectedTextId ? slide.texts.find(x => x.id === selectedTextId) : null;
  const ctrl = document.getElementById('textControls');
  const note = document.getElementById('noTextNote');
  if(t){
    ctrl.style.display = 'block'; note.style.display = 'none';
    document.getElementById('txtContent').value = t.content;
    document.getElementById('txtSize').value = t.size;
    document.getElementById('txtColor').value = t.color;
    document.getElementById('txtWeight').value = t.weight;
  } else {
    ctrl.style.display = 'none'; note.style.display = 'block';
  }
}

// ---- Rendering ----
function loadImg(src){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function drawSlideOnCanvas(slide, targetCtx){
  targetCtx.clearRect(0,0,CANVAS_W,CANVAS_H);
  // Background
  if(slide.bg.type === 'image'){
    const img = await loadImg(slide.bg.value);
    if(img){
      const cw=CANVAS_W, ch=CANVAS_H;
      const ir = img.width/img.height, cr = cw/ch;
      let sw,sh,sx,sy;
      if(ir > cr){ sh = img.height; sw = sh*cr; sx=(img.width-sw)/2; sy=0; }
      else { sw = img.width; sh = sw/cr; sx=0; sy=(img.height-sh)/2; }
      targetCtx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    }
  } else {
    targetCtx.fillStyle = slide.bg.value;
    targetCtx.fillRect(0,0,CANVAS_W,CANVAS_H);
  }
  // Brightness overlay
  const b = slide.bg.brightness !== undefined ? slide.bg.brightness : 100;
  if(b < 100){
    targetCtx.fillStyle = `rgba(0,0,0,${(100-b)/100 * 0.85})`;
    targetCtx.fillRect(0,0,CANVAS_W,CANVAS_H);
  }
  // Texts
  slide.texts.forEach(t => {
    targetCtx.font = `${t.weight} ${t.size}px Montserrat, sans-serif`;
    targetCtx.fillStyle = t.color;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    const lines = t.content.split('\n');
    const lineHeight = t.size * 1.25;
    const totalH = lineHeight * lines.length;
    lines.forEach((line, i) => {
      targetCtx.fillText(line, t.x, t.y - totalH/2 + lineHeight*(i+0.5));
    });
    if(t.id === selectedTextId){
      const widths = lines.map(l => targetCtx.measureText(l).width);
      const w = Math.max(...widths) + 24;
      targetCtx.strokeStyle = '#FF5A73';
      targetCtx.lineWidth = 3;
      targetCtx.setLineDash([10,8]);
      targetCtx.strokeRect(t.x - w/2, t.y - totalH/2 - 12, w, totalH + 24);
      targetCtx.setLineDash([]);
    }
  });
}

async function redrawCanvas(){
  const slide = currentSlide();
  if(!slide){ ctx.clearRect(0,0,CANVAS_W,CANVAS_H); return; }
  await drawSlideOnCanvas(slide, ctx);
}

// ---- Drag & drop de texto en el canvas ----
function getCanvasCoords(e){
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  const cy = (e.clientY - rect.top) * (CANVAS_H / rect.height);
  return { x: cx, y: cy };
}
function hitTestText(slide, x, y){
  for(let i = slide.texts.length - 1; i >= 0; i--){
    const t = slide.texts[i];
    ctx.font = `${t.weight} ${t.size}px Montserrat, sans-serif`;
    const lines = t.content.split('\n');
    const widths = lines.map(l => ctx.measureText(l).width);
    const w = Math.max(...widths) + 24;
    const lineHeight = t.size * 1.25;
    const h = lineHeight * lines.length + 24;
    if(x >= t.x - w/2 && x <= t.x + w/2 && y >= t.y - h/2 && y <= t.y + h/2) return t;
  }
  return null;
}
canvas.addEventListener('mousedown', (e) => {
  const slide = currentSlide(); if(!slide) return;
  const { x, y } = getCanvasCoords(e);
  const hit = hitTestText(slide, x, y);
  if(hit){
    selectedTextId = hit.id;
    dragging = { id: hit.id, offsetX: x - hit.x, offsetY: y - hit.y };
    updateTextPanel();
    redrawCanvas();
  } else {
    selectedTextId = null;
    updateTextPanel();
    redrawCanvas();
  }
});
canvas.addEventListener('mousemove', (e) => {
  if(!dragging) return;
  const slide = currentSlide(); if(!slide) return;
  const t = slide.texts.find(t => t.id === dragging.id);
  if(!t) return;
  const { x, y } = getCanvasCoords(e);
  t.x = Math.max(0, Math.min(CANVAS_W, x - dragging.offsetX));
  t.y = Math.max(0, Math.min(CANVAS_H, y - dragging.offsetY));
  redrawCanvas();
});
window.addEventListener('mouseup', () => { dragging = null; });

// ---- Guardar en Supabase ----
document.getElementById('btnSaveSeq').onclick = async () => {
  if(!sb){ openModal('modalSb'); return; }
  const seq = currentSeq(); if(!seq) return;
  const payload = { nombre: seq.nombre, slides: seq.slides, updated_at: new Date().toISOString() };
  try{
    if(seq.id){
      const { error } = await sb.from('historias_secuencias').update(payload).eq('id', seq.id);
      if(error) throw error;
    } else {
      const { data, error } = await sb.from('historias_secuencias').insert(payload).select().single();
      if(error) throw error;
      seq.id = data.id;
      currentSeqId = data.id;
    }
    renderSeqList();
    alert('Guardado.');
  }catch(e){
    alert('Error al guardar: ' + e.message);
  }
};

// ---- Exportar ZIP ----
document.getElementById('btnExport').onclick = async () => {
  const seq = currentSeq(); if(!seq || seq.slides.length === 0) return;
  const btn = document.getElementById('btnExport');
  const original = btn.textContent;
  btn.textContent = 'Generando...'; btn.disabled = true;
  try{
    const zip = new JSZip();
    const off = document.createElement('canvas');
    off.width = CANVAS_W; off.height = CANVAS_H;
    const offCtx = off.getContext('2d');
    const prevSelected = selectedTextId;
    selectedTextId = null; // no dibujar el recuadro de selección en el export
    for(let i=0; i<seq.slides.length; i++){
      await drawSlideOnCanvas(seq.slides[i], offCtx);
      const blob = await new Promise(res => off.toBlob(res, 'image/png'));
      zip.file(`${String(i+1).padStart(2,'0')}.png`, blob);
    }
    selectedTextId = prevSelected;
    const content = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(seq.nombre||'historias').replace(/\s+/g,'_')}.zip`;
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Error al exportar: ' + e.message);
  }
  btn.textContent = original; btn.disabled = false;
};

// Estado inicial sin Supabase conectado
if(!sb){
  sequences = [newSequence()];
  currentSeqId = sequences[0].id;
  renderSeqList();
  loadSlideIntoEditor();
}
</script>

</body>
</html>
